      if (this.title.alpha <= 0) this.title.active = false;
    }
    for (const arr of this.field.slots) for (const n of arr) n.firedFlash = Math.max(0, n.firedFlash - dt * 3);
    this.particles.update(dt);

    /* comet trail: render trail + timed buffer for the causal ghosts */
    p.trail.push({ x: p.x, y: p.y });
    while (p.trail.length > cfg.TRAIL_LEN) p.trail.shift();
    this.trailBuf.push({ x: p.x, y: p.y, t: now });
    while (this.trailBuf.length > 200 || (this.trailBuf.length && this.trailBuf[0].t < now - 3)) {
      this.trailBuf.shift();
    }

    /* 6) palette drift: navy -> violet -> gold as the run survives */
    this.hue = runHue(Math.max(0, this.runLoop - 1) + (this.runLoop > 0 ? h.phase : 0), cfg);

    /* 7) collision — swept per physics substep, see stepPhysics() */
  }

  /* uses the RAW pointer position (pointerIn), not the clamped target —
   * otherwise the clamp would fake an arena entry from outside          */
  pointerInArena() { return this.pointerIn; }

  dissolveTitle() {
    this.title.dissolving = true;
    for (const L of this.title.letters) {
      const p = this.notePosPx(L.step, L.band);
      for (let i = 0; i < 5; i++) {
        const a = cosmRand() * TAU;
        this.particles.spawn({
          x: p.x, y: p.y, vx: Math.cos(a) * 70, vy: Math.sin(a) * 70,
          life: 0.9, size: 1.6, hue: 48, sat: 90, lit: 75, drag: 0.93,
        });
      }
    }
  }

  render() { this.renderer.render(this); }

  /* introspection for the tuner panel & headless harness */
  debugInfo() {
    return {
      state: this.state,
      runLoop: this.runLoop,
      period: this.head ? this.head.period : 0,
      notesAlive: this.field.count(),
      fires: this.bank.fires,
      matured: this.bank.matured,
      banked: this.bank.banked,
      pending: this.bank.pending,
      lost: this.bank.lost,
      ghostCueLeft: this.ghostCueLeft,
      result: this.result,
      audioUnlocked: this.audio.unlocked,
    };
  }
}

/* factory: every platform dependency arrives via env (testability) */
function createGame(env) {
  if (!env.createCanvas) {
    env.createCanvas = function (w, h) {
      const c = env.document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    };
  }
  return new Game(env);
}

/* =====================================================================
 * [G] Boot / DOM wiring / tuner panel / exports
 * =================================================================== */

const OSTINATO = {
  CONFIG, applyConfigOverrides,
  innerNorm, bandFromRadius, bandRadiusNorm, pentaFreq,
  scorePerFire, ringSpeedFor, ringHits, runHue,
  NoteField, Bank, StepTimeline, MusicClock,
  AudioEngine, ParticlePool, Renderer, Game, createGame,
};

function bootBrowser() {
  applyConfigOverrides(CONFIG, window.location.search);
  const canvas = document.getElementById('game');
  let storage = null;
  try { storage = window.localStorage; } catch (e) {}
  const game = createGame({
    canvas,
    document,
    AudioCtx: window.AudioContext || window.webkitAudioContext,
    storage,
  });
  window.__OSTINATO_GAME__ = game;

  const resize = () => game.resize(window.innerWidth, window.innerHeight,
    Math.max(1, Math.min(3, window.devicePixelRatio || 1)));
  window.addEventListener('resize', resize);
  resize();

  /* --- input ------------------------------------------------------- */
  const local = e => {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  canvas.addEventListener('pointermove', e => {
    const p = local(e);
    game.pointerMove(p.x, p.y, e.pointerType === 'touch');
  });
  canvas.addEventListener('pointerdown', e => {
    const p = local(e);
    game.pointerDown(p.x, p.y, e.pointerType === 'touch');
  });
  canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyD' && e.shiftKey) { toggleTuner(); e.preventDefault(); return; }
    if (e.code === 'Space' && game.paused) { game.setPaused(false); return; }
    game.keyInput(e.code, true);
  });
  window.addEventListener('keyup', e => game.keyInput(e.code, false));

  /* auto-pause when the window loses focus (AudioContext suspends) */
  window.addEventListener('blur', () => { if (game.state !== 'result') game.setPaused(true); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && game.state !== 'result') game.setPaused(true);
  });

  /* --- main loop (rAF) + scheduler safety tick (25ms, decoupled) ---- */
  let last = (window.performance || Date).now();
  let fps = 60, fpsAcc = 0, fpsN = 0;
  function frame(t) {
    const dt = Math.min(0.1, (t - last) / 1000);
    last = t;
    fpsAcc += dt; fpsN++;
    if (fpsAcc >= 0.5) { fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }
    game.update(dt);
    game.render();
    updateTunerStats(game, fps);
    window.requestAnimationFrame(frame);
  }
  window.requestAnimationFrame(frame);

  /* lookahead audio scheduler must not starve if rAF throttles:
   * an interval tick advances the same committed timeline (idempotent) */
  window.setInterval(() => {
    if (game.paused) return;
    if (game.state === 'dying') return;
    game.clock.advance(0);
    const horizon = game.clock.t + CONFIG.LOOKAHEAD_MS / 1000;
    if (game.state === 'result') {
      if (game.requiem) game.updateRequiem(game.clock.t);
    } else {
      game.timeline.advanceUntil(horizon, evt => game.commitStep(evt));
    }
  }, CONFIG.TICK_MS);

  /* --- hidden tuner panel (Shift+D) --------------------------------- */
  const tunerEl = document.getElementById('tuner');
  let tunerBuilt = false, tunerStats = null;
  function toggleTuner() {
    tunerEl.hidden = !tunerEl.hidden;
    if (!tunerEl.hidden && !tunerBuilt) { buildTuner(); tunerBuilt = true; }
  }
  function buildTuner() {
    tunerEl.innerHTML = '';
    const h = document.createElement('h3');
    h.textContent = 'OSTINATO TUNER';
    tunerEl.appendChild(h);
    /* pool/array sizes and the physics step are baked in at construction;
     * a live change desyncs them (e.g. STEPS_PER_REV > NoteField.slots
     * length -> undefined slot -> throw in the rAF loop). URL params still
     * apply to these — they run before construction.                     */
    const STRUCT_KEYS = { STEPS_PER_REV: 1, MAX_RINGS: 1, MAX_PARTICLES: 1, PHYS_DT: 1 };
    for (const k of Object.keys(CONFIG)) {
      if (typeof CONFIG[k] !== 'number' || STRUCT_KEYS[k]) continue;
      const row = document.createElement('div');
      row.className = 'row';
      const label = document.createElement('label');
      label.textContent = k;
      const input = document.createElement('input');
      input.type = 'number';
      input.step = 'any';
      input.value = String(CONFIG[k]);
      input.addEventListener('change', () => {
        const v = parseFloat(input.value);
        if (Number.isFinite(v)) { CONFIG[k] = v; sanitizeConfig(CONFIG); }
        input.value = String(CONFIG[k]); /* echo back the clamped value */
      });
      row.appendChild(label);
      row.appendChild(input);
      tunerEl.appendChild(row);
    }
    tunerStats = document.createElement('div');
    tunerStats.className = 'stat';
    tunerEl.appendChild(tunerStats);
  }
  function updateTunerStats(g, fpsNow) {
    if (!tunerStats || tunerEl.hidden) return;
    const d = g.debugInfo();
    tunerStats.textContent =
      'fps ' + fpsNow + ' | ' + d.state + ' | loop ' + d.runLoop +
      ' | period ' + d.period.toFixed(2) + 's | notes ' + d.notesAlive +
      ' | banked ' + d.banked + ' | pending ' + d.pending;
  }
}

if (typeof window !== 'undefined' && window && window.document &&
    window.document.getElementById && window.document.getElementById('game') &&
    !window.__OSTINATO_NO_AUTOBOOT__) {
  window.OSTINATO = OSTINATO;
  bootBrowser();
}
if (typeof module !== 'undefined' && module && module.exports) {
  module.exports = OSTINATO;
}
</script>
</body>
</html>
